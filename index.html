<!DOCTYPE html>
<html>
    <head>
        <meta charset ="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>

    </head>
    <body>
        <h1>My multimedia website</h1>

        <div>
        <h2>My image</h2>
        <img src="lily.jpg" alt="lily" width="300">
        </div>


        <div> 
        <h2>My video</h2>
        <video controls width="200" poster="thumbnail.jpg" autoplay muted loop>
            <source src="video.mp4" type="video/mp4">
        </video>
        </div>


        <div>
            <h2>My audio</h2>  
        <audio controls autoplay muted loop>
            <source src="audio.mp3"type="audio/mpeg">
        </audio>
        </div>

        
    </body>
</html>
